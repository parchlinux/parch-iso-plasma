# Repository hygiene hooks. Run with: pre-commit run --all-files
ci:
  autoupdate_schedule: monthly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-case-conflict
      # Generated/user config snapshots in the skel tree must not be touched.
      - id: trailing-whitespace
        exclude: (^iso/airootfs/etc/skel/|^iso/public\.key$)
      - id: end-of-file-fixer
        exclude: (^iso/airootfs/etc/skel/|^iso/public\.key$)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      # Lint the ISO scripts we maintain. Files kept identical to upstream
      # archiso (e.g. livecd-sound) are left out on purpose.
      - id: shellcheck
        files: ^(build\.sh|iso/airootfs/(root/\.automated_script\.sh|usr/local/bin/choose-mirror))$
