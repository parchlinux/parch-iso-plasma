title    Parch Linux install medium with proprietary NVIDIA drivers (x86_64, UEFI)
sort-key 02
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% driver=nonfree modprobe.blacklist=nouveau nvidia_drm.modeset=1
