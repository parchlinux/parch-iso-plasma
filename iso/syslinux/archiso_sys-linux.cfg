LABEL arch64
TEXT HELP
Boot the Parch Linux install medium on BIOS with open source drivers.
It allows you to install Parch Linux or perform system maintenance.
ENDTEXT
MENU LABEL Parch Linux install medium (x86_64, BIOS, open source)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% driver=free

# NVIDIA boot option
LABEL arch64nvidia
TEXT HELP
Boot the Parch Linux install medium on BIOS with proprietary NVIDIA drivers.
It allows you to install Parch Linux with official NVIDIA GPU support.
ENDTEXT
MENU LABEL Parch Linux install medium (x86_64, BIOS, NVIDIA drivers)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% driver=nonfree modprobe.blacklist=nouveau nvidia_drm.modeset=1

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Parch Linux install medium on BIOS with speakup screen reader.
It allows you to install Parch Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Parch Linux install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% accessibility=on

