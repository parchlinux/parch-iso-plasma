name: build parchiso per release

on:
  release:
    types:
      - created

env:
  VARIANT: plasma

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install packages via pacman
        run: pacman -Syu --noconfirm --needed git archiso python python-pygithub github-cli reflector p7zip openssh sshpass rsync wget
      - name: Update pacman mirrors
        run: reflector --latest 5 --sort rate --save /etc/pacman.d/mirrorlist
      - name: Build image
        run: mkarchiso -v iso/
      - name: Install netbird client
        run: |
          curl -LO https://github.com/netbirdio/netbird/releases/download/v0.74.1/netbird_0.74.1_linux_amd64.tar.gz
          tar -xzf netbird_0.74.1_linux_amd64.tar.gz
          mv netbird /usr/bin/netbird
          chmod +x /usr/bin/netbird
      - name: Prepare tun device
        run: |
          if [ ! -c /dev/net/tun ]; then
            mkdir -p -m 755 /dev/net
            mknod /dev/net/tun c 10 200
            chmod 0666 /dev/net/tun
          fi
      - name: Connect to Netbird
        run: |
          netbird service run &
          sleep 3
          netbird up \
            --setup-key "${{ secrets.BIRD }}" \
            --management-url https://netbird.parchlinux.ir:443
          netbird status
      - name: Clear remote directory
        run: sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no parch@${{ secrets.NETIP }} rm -rf /srv/http/${VARIANT}/
      - name: Create remote directory
        run: sshpass -p "${{ secrets.SSH_PASS }}" ssh -o StrictHostKeyChecking=no parch@${{ secrets.NETIP }} mkdir /srv/http/${VARIANT}/
      - name: Rename ISO
        run: |
          iso_file=$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)
          if [ -z "$iso_file" ]; then
            echo "error: no *.iso file found in out/" >&2
            exit 1
          fi
          mv "$iso_file" out/Parchlinux-${VARIANT}-latest.iso
      - name: Generate checksums
        run: |
          ISO_FILE="out/Parchlinux-${VARIANT}-latest.iso"
          sha256sum "$ISO_FILE" > out/sha256sum.txt
          md5sum "$ISO_FILE" > out/md5sum.txt
      - name: Upload ISO to host
        run: sshpass -p "${{ secrets.SSH_PASS }}" rsync -r out/Parchlinux-${VARIANT}-latest.iso parch@${{ secrets.NETIP }}:/srv/http/${VARIANT}/
      - name: Upload checksums to host
        run: sshpass -p "${{ secrets.SSH_PASS }}" rsync -r out/sha256sum.txt out/md5sum.txt parch@${{ secrets.NETIP }}:/srv/http/${VARIANT}/
      - name: Disconnect from Netbird
        if: always()
        run: netbird down
